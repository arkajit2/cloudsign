name = "cloudsign"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Cloudflare D1 Serverless SQL Database binding
[[d1_databases]]
binding = "DB"
database_name = "cloudsign-db"
database_id = "78c55121-f552-49ff-82ec-171f1a05ffaf"

# Cloudflare R2 Object Storage binding (Optional - uncomment once R2 is toggled in CF dashboard)
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "cloudsign-documents"

[vars]
ENVIRONMENT = "production"
APP_NAME = "CloudSign"
AUDIT_TRAIL_ENABLED = "true"
